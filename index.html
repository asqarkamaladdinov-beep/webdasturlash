<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire 1v1 Arena</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #000;
        }

        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Nishon (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
        #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }

        /* HUD - HP va Ammo */
        .hud-box {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 12px;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        #playerHUD { left: 20px; }
        #enemyHUD { right: 20px; text-align: right; }

        .hp-bar-bg {
            width: 200px;
            height: 16px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid #555;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }
        #playerHpFill { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
        #enemyHpFill { background: linear-gradient(90deg, #f7b731, #eb3b5a); }

        #ammoBox {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #f1c40f;
        }

        /* Start / Game Over Screen */
        #screenOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
        }
        #screenOverlay h1 { font-size: 48px; margin-bottom: 10px; color: #ff4757; text-transform: uppercase; letter-spacing: 3px; }
        #screenOverlay p { font-size: 18px; color: #ccc; }
    </style>
    <!-- Three.js Kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="screenOverlay">
        <h1 id="titleText">FREE FIRE 1v1 DUEL</h1>
        <p id="subText">O'yinni boshlash uchun ekranni bosing</p>
    </div>

    <div id="gameUI">
        <div id="crosshair"></div>
        
        <div id="playerHUD" class="hud-box">
            <div>Siz (Player)</div>
            <div class="hp-bar-bg"><div id="playerHpFill" class="hp-bar-fill"></div></div>
        </div>

        <div id="ammoBox">30 / 120</div>

        <div id="enemyHUD" class="hud-box">
            <div>Dushman (Bot 1v1)</div>
            <div class="hp-bar-bg"><div id="enemyHpFill" class="hp-bar-fill"></div></div>
        </div>
    </div>

    <script>
        // --- 1. O'YIN SOZLAMALARI VA O'ZGARUVCHILAR ---
        let scene, camera, renderer;
        let player = { hp: 100, maxHp: 100, ammo: 30, reserveAmmo: 120, maxAmmo: 30, isDead: false };
        let enemy = { mesh: null, hp: 100, maxHp: 100, isDead: false, lastShoot: 0 };
        
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let canJump = false;
        let isGrounded = true;

        let prevTime = performance.now();
        let isGameStarted = false;
        let bullets = [];

        const overlay = document.getElementById('screenOverlay');
        const titleText = document.getElementById('titleText');
        const subText = document.getElementById('subText');

        // --- 2. BAXSH va SAHNA YARATISH ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Osmon rangi
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Yorug'lik
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Xarita (Map / Arena)
            createMap();

            // Dushmanni yaratish (Bot 1v1)
            createEnemy();

            // Hodisalar (Events)
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mousemove', onMouseMove);

            overlay.addEventListener('click', startGame);
        }

        // --- 3. ARENA VA O'YIN MAYDONI ---
        function createMap() {
            // Yer (Ground)
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Devorlar (Borders)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
            const wallGeo = new THREE.BoxGeometry(80, 10, 2);

            const w1 = new THREE.Mesh(wallGeo, wallMat); w1.position.set(0, 5, -40); scene.add(w1);
            const w2 = new THREE.Mesh(wallGeo, wallMat); w2.position.set(0, 5, 40); scene.add(w2);
            
            const w3 = new THREE.Mesh(wallGeo, wallMat); 
            w3.rotation.y = Math.PI / 2; w3.position.set(-40, 5, 0); scene.add(w3);
            
            const w4 = new THREE.Mesh(wallGeo, wallMat); 
            w4.rotation.y = Math.PI / 2; w4.position.set(40, 5, 0); scene.add(w4);

            // Boshpanalar (Cover Blocks - Gloo Wall uslubida)
            const boxGeo = new THREE.BoxGeometry(4, 4, 4);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xe67e22 });

            const positions = [
                [-10, 2, 0], [10, 2, 0], [0, 2, -10], [0, 2, 10],
                [-15, 2, -15], [15, 2, -15], [-15, 2, 15], [15, 2, 15]
            ];

            positions.forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(...pos);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
            });
        }

        // --- 4. DUSHMAN (BOT) YARATISH ---
        function createEnemy() {
            const group = new THREE.Group();

            // Tana
            const bodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 3, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5;
            body.castShadow = true;
            group.add(body);

            // Bosh
            const headGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 3.3;
            group.add(head);

            group.position.set(0, 0, -25);
            scene.add(group);

            enemy.mesh = group;
        }

        // --- 5. BOSHQARUV VA SICHQONCHA ---
        let pitch = 0, yaw = 0;

        function onMouseMove(e) {
            if (document.pointerLockElement !== document.body) return;

            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;

            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.x = pitch;
            camera.rotation.y = yaw;
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': 
                    if (isGrounded) { velocity.y += 12; isGrounded = false; }
                    break;
                case 'KeyR': reloadAmmo(); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        // --- 6. OTISHMA MEXANIKASI ---
        function onMouseDown(e) {
            if (!isGameStarted || player.isDead) return;
            if (e.button === 0) { // Chap tugma
                shootBullet();
            }
        }

        function shootBullet() {
            if (player.ammo <= 0) {
                reloadAmmo();
                return;
            }

            player.ammo--;
            updateHUD();

            const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            bullet.userData = {
                direction: dir,
                speed: 120,
                createdTime: performance.now(),
                isPlayer: true
            };

            bullets.push(bullet);
            scene.add(bullet);
        }

        function reloadAmmo() {
            if (player.reserveAmmo <= 0 || player.ammo === player.maxAmmo) return;
            let needed = player.maxAmmo - player.ammo;
            let toAdd = Math.min(needed, player.reserveAmmo);
            player.ammo += toAdd;
            player.reserveAmmo -= toAdd;
            updateHUD();
        }

        // --- 7. BOT SUN'IY INTELLEKTI (AI Logic) ---
        function updateEnemyAI(delta) {
            if (enemy.isDead || player.isDead) return;

            const bot = enemy.mesh;
            const dist = bot.position.distanceTo(camera.position);

            // Bot o'yinchiga qaraydi
            bot.lookAt(camera.position.x, bot.position.y, camera.position.z);

            // Agar uzoq bo'lsa yaqinlashadi
            if (dist > 10) {
                bot.translateZ(4 * delta);
            }

            // Bot otish mantiqi (Har 1.2 sekundda bir marta)
            const now = performance.now();
            if (now - enemy.lastShoot > 1200) {
                enemyShoot();
                enemy.lastShoot = now;
            }
        }

        function enemyShoot() {
            const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xff4757 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(enemy.mesh.position);
            bullet.position.y += 2; // Bosh balandligidan otadi

            const dir = new THREE.Vector3().subVectors(camera.position, bullet.position).normalize();

            // Biroz tarqoqlik (Inaccuracy)
            dir.x += (Math.random() - 0.5) * 0.1;
            dir.y += (Math.random() - 0.5) * 0.1;

            bullet.userData = {
                direction: dir,
                speed: 80,
                createdTime: performance.now(),
                isPlayer: false
            };

            bullets.push(bullet);
            scene.add(bullet);
        }

        // --- 8. O'YIN SIKLI VA YANGILANISH (LOOP) ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (isGameStarted && !player.isDead) {
                // O'yinchi harakatini hisoblash
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; // Gravitatsiya

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 80.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 80.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // Yerga tegishni tekshirish
                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    isGrounded = true;
                }

                // Xarita chegarasi
                camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
                camera.position.z = Math.max(-38, Math.min(38, camera.position.z));

                // Botni yangilash
                updateEnemyAI(delta);

                // O'qlarni yangilash va To'qnashuvlar (Collisions)
                updateBullets(delta);
            }

            renderer.render(scene, camera);
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.direction, b.userData.speed * delta);

                // Player o'qi botga tegdimi?
                if (b.userData.isPlayer && !enemy.isDead) {
                    if (b.position.distanceTo(enemy.mesh.position) < 2) {
                        enemy.hp -= 15;
                        updateHUD();
                        createHitEffect(b.position, 0xff0000);
                        scene.remove(b);
                        bullets.splice(i, 1);

                        if (enemy.hp <= 0) {
                            enemy.isDead = true;
                            scene.remove(enemy.mesh);
                            endGame(true);
                        }
                        continue;
                    }
                }

                // Bot o'qi playerga tegdimi?
                if (!b.userData.isPlayer && !player.isDead) {
                    if (b.position.distanceTo(camera.position) < 1.5) {
                        player.hp -= 10;
                        updateHUD();
                        createHitEffect(b.position, 0xff4757);
                        scene.remove(b);
                        bullets.splice(i, 1);

                        if (player.hp <= 0) {
                            player.isDead = true;
                            endGame(false);
                        }
                        continue;
                    }
                }

                // Eski o'qlarni o'chirish (2 sekunddan keyin)
                if (performance.now() - b.userData.createdTime > 2000) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        function createHitEffect(pos, color) {
            const pGeo = new THREE.BufferGeometry();
            const count = 10;
            const positions = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) positions[i] = (Math.random() - 0.5) * 0.5;
            pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const pMat = new THREE.PointsMaterial({ color: color, size: 0.1 });
            const pts = new THREE.Points(pGeo, pMat);
            pts.position.copy(pos);
            scene.add(pts);

            setTimeout(() => scene.remove(pts), 200);
        }

        // --- 9. UI VA O'YIN HOLATLARI ---
        function updateHUD() {
            document.getElementById('playerHpFill').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            document.getElementById('enemyHpFill').style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + '%';
            document.getElementById('ammoBox').innerText = `${player.ammo} / ${player.reserveAmmo}`;
        }

        function startGame() {
            document.body.requestPointerLock();
            overlay.style.display = 'none';
            
            if (player.isDead || enemy.isDead) {
                resetGame();
            }

            isGameStarted = true;
        }

        function endGame(isWin) {
            isGameStarted = false;
            document.exitPointerLock();
            overlay.style.display = 'flex';

            if (isWin) {
                titleText.innerText = "VICTORY! (BOOYAH!)";
                titleText.style.color = "#2ecc71";
                subText.innerText = "Siz 1v1 duelda g'olib bo'ldingiz! Qayta o'ynash uchun bosing.";
            } else {
                titleText.innerText = "DEFEAT (MAG'LUBIYAT)";
                titleText.style.color = "#e74c3c";
                subText.innerText = "Bot sizni mag'lub etdi! Qayta urinib ko'rish uchun bosing.";
            }
        }

        function resetGame() {
            player.hp = 100;
            player.ammo = 30;
            player.reserveAmmo = 120;
            player.isDead = false;

            enemy.hp = 100;
            enemy.isDead = false;

            camera.position.set(0, 2, 25);
            pitch = 0; yaw = 0;

            if (!enemy.mesh.parent) scene.add(enemy.mesh);
            enemy.mesh.position.set(0, 0, -25);

            updateHUD();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Boshlash
        init();
        animate();
    </script>
</body>
</html>
